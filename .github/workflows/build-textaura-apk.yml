name: Build TextAura APK
on:
  push:
    branches: [textaura-apk]
    paths: ['textaura-build/**', '.github/workflows/build-textaura-apk.yml']
  pull_request:
    branches: [master]
    paths: ['textaura-build/**', '.github/workflows/build-textaura-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textaura-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log
      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TextAura-v3-diagnostics
          path: |
            textaura-build/test.log
            textaura-build/build.log
            textaura-build/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TextAura-v3.0.0-APK
          path: textaura-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
