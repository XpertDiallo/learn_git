name: TextAura Web CI

on:
  push:
    branches: [textaura-web]
    paths:
      - 'textaura-web/**'
      - '.github/workflows/textaura-web-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'textaura-web/**'
      - '.github/workflows/textaura-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textaura-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: npm run check
      - name: Security assertions
        run: |
          ! grep -R -E 'dangerouslySetInnerHTML|eval\(' -n . --include='*.js'
          ! grep -R -E 'fetch\(|XMLHttpRequest|WebSocket' -n app.js core.js emoji-data.js
          grep -q "connect-src 'none'" index.html
          grep -q "object-src 'none'" index.html
      - name: PWA integrity
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          grep -q 'serviceWorker' app.js
          grep -q 'manifest.webmanifest' index.html
