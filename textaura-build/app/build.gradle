plugins { id 'com.android.application' }

android {
  namespace 'com.textaura.social'
  compileSdk 35

  defaultConfig {
    applicationId 'com.textaura.social'
    minSdk 24
    targetSdk 35
    versionCode 3
    versionName '2.1.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.core:core:1.15.0'
}
